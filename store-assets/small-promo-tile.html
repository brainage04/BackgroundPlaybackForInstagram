<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Background Playback promo tile</title>
    <link rel="stylesheet" href="listing.css" />
    <style>
      body {
        display: grid;
        width: 440px;
        min-height: 280px;
        place-items: center;
        padding: 32px;
      }

      .tile {
        text-align: center;
      }

      .tile img {
        width: 76px;
        height: 76px;
        margin-bottom: 14px;
      }

      h1 {
        margin-bottom: 10px;
        font-size: 30px;
      }

      p {
        margin-bottom: 0;
        color: #fbcfe8;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="tile">
      <img src="../icons/icon.svg" alt="" />
      <h1>Background Playback</h1>
      <p>Instagram videos keep playing in other tabs.</p>
    </main>
  </body>
</html>
